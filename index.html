<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#3D003D" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Route SEO (title/meta/canonical/OG/Twitter/JSON-LD) is injected per
      route at SSG time (src/prerender.tsx) and managed client-side by
      SeoHost (react-helmet-async) — never hardcoded here, so prerendered
      pages never ship duplicate or stale tags. -->
    <title>V V Studio | Luxury Salon | Female Salon | J P Nagar, Bengaluru</title>
    
    <!-- Brand fonts: self-hosted under /fonts (same files Google Fonts serves,
         immutable-cached) — zero third-party origins on the LCP path. Faces +
         unicode-ranges are declared in src/index.css; preload the latin files
         the hero needs so first paint uses final metrics (no CLS from swap). -->
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://vvstudio.in" crossorigin />
    <link rel="dns-prefetch" href="https://vvstudio.in" />
    <!-- LCP hero image: same srcset/sizes as the Hero <img> so the preloaded candidate matches exactly. -->
    <link rel="preload" as="image" type="image/webp" href="/images/home/home_top_banner-1280.webp" imagesrcset="/images/home/home_top_banner-768.webp 768w, /images/home/home_top_banner-1280.webp 1280w, /images/home/home_top_banner-1440.webp 1440w, /images/home/home_top_banner.webp 1920w" imagesizes="100vw" fetchpriority="high" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/plus-jakarta-sans-latin.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/playfair-display-latin-italic.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/alex-brush-latin.woff2" />
    <!-- ARD 1.0 agent manifest + llms.txt discovery (also injected per-route at SSG time). -->
    <link rel="ai-catalog" href="/.well-known/ai-catalog.json" type="application/ai-catalog+json" />
  </head>
  <body class="bg-[#FCFCFC] text-[#40363F] antialiased selection:bg-[#D91A8A] selection:text-white font-sans overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
